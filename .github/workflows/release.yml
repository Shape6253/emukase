name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest main branch and release tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish the initial 0.2.0 release
        id: initial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            gh release create v0.2.0 \
              --target "$(git rev-parse HEAD)" \
              --title v0.2.0 \
              --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.initial.outputs.created != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        if: steps.initial.outputs.created != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.initial.outputs.created != 'true'
        run: bun install --frozen-lockfile

      - name: Publish a release when commits require one
        if: steps.initial.outputs.created != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
